name: system-defense

on:
  push:
    paths: ['system-defense/**', '.github/workflows/system-defense.yml']
  pull_request:
    paths: ['system-defense/**', '.github/workflows/system-defense.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-defense
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: system-defense/package-lock.json
      - run: npm ci
      # types + all tests (rules, languages, full games, engine load) + production build
      - run: npm run check
      - name: HTTP load test on the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          npm run loadtest -- --url http://localhost:4173 --connections 100 --duration 10
      # The deploy job publishes these exact files: what was tested is what goes live.
      - name: Keep the tested build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: system-defense/dist
          retention-days: 3
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (runs the tests again inside)
        run: docker build -t system-defense:ci system-defense
      - name: Smoke test the container
        run: |
          docker run -d --name sd -p 8080:8080 system-defense:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -sI http://localhost:8080/ | grep -i "content-security-policy"
          curl -s http://localhost:8080/ | grep -q "<title>Defend the Arki"

  # Firebase Hosting (Google Cloud). Only on push to main, only after every check passed.
  # One-time setup: scripts/setup-gcp.sh (creates the repository variables used below).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets GitHub ask Google for a short-lived token (no stored key)
    defaults:
      run:
        working-directory: system-defense
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: system-defense/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Deploy to Firebase Hosting
        run: >
          npx --yes firebase-tools@15.34.1 deploy --only hosting --non-interactive
          --project "${{ vars.GCP_PROJECT_ID }}" --message "${{ github.sha }}"
      # PRODUCTION_URL (repository variable) is the custom domain, once it is set up.
      - name: Smoke test production
        env:
          URLS: https://${{ vars.GCP_PROJECT_ID }}.web.app ${{ vars.PRODUCTION_URL }}
        run: |
          for url in $URLS; do
            echo "Checking $url"
            curl -sfI "$url/" | grep -i "content-security-policy"
            curl -sf "$url/" | grep -q "<title>Defend the Arki"
          done
