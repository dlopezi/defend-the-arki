# System Defense: static site (index.html + hashed assets). No backend.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Files are pre-compressed at build time (scripts/compress.mjs): no CPU per request.
  gzip_static on;
  # Fallback for anything not pre-compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # Hashed files (index-XXXX.js / .css): cache for a year, they never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Web app manifest ("Add to Home Screen"): nginx has no type for .webmanifest.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # The page itself: always check for a new version.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
