<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58 -16 64 44" width="256" height="176">
  <!-- Lower jaw. Jaw space: hinge at (0, 0). -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d6d3d1"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0 V8 M0 0 H8" stroke="#facc15" stroke-opacity="0.14" stroke-width="1.2" fill="none"/>
    </pattern>
    <clipPath id="jawClip">
      <path d="M 0 0 L -50 -6 C -54 4 -50 16 -42 20 L -6 24 C -1 20 2 10 0 0 Z"/>
    </clipPath>
  </defs>
  <path d="M 0 0 L -50 -6 C -54 4 -50 16 -42 20 L -6 24 C -1 20 2 10 0 0 Z"
        fill="url(#metal)" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/>
  <g clip-path="url(#jawClip)">
    <rect x="-60" y="-10" width="70" height="40" fill="url(#mesh)"/>
    <path d="M -60 10 L 10 6 L 10 30 L -60 30 Z" fill="#000" opacity="0.45"/>
  </g>
  <path d="M -50 -6 C -54 4 -50 16 -42 20 L -6 24" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="url(#tooth)" stroke="#0a0a0a" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="-48,-5 -42,-5.8 -46,-11.4"/>
    <polygon points="-40,-3.92 -32,-4.72 -37,-12.32"/>
    <polygon points="-30,-2.84 -24,-3.64 -28,-9.24"/>
    <polygon points="-22.5,-1.76 -13.5,-2.56 -19,-11.16"/>
    <polygon points="-12,-0.68 -6,-1.48 -10,-6.08"/>
  </g>
</svg>
