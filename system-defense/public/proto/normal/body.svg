<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -38 46 58" width="276" height="348">
  <!-- Tráfico Normal "Request Runner" · body (head + torso). Body space; feet at y = 28, lean pivot (0, 14). -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#a5b4c8"/>
      <stop offset="0.6" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- satchel on the back hip (asymmetric) -->
  <path d="M 6 -2 L 17 -3 L 18 10 L 6 11 Z" fill="url(#bag)" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 6 1.5 L 17.5 0.8" stroke="#fbbf24" stroke-width="1"/>

  <!-- body: a bean leaning forward, head at the front-top -->
  <path d="M -6 -28 C 6 -30 16 -22 16 -10 C 16 4 12 14 2 16 C -10 17 -16 8 -16 -2 C -16 -10 -20 -14 -18 -20 C -16 -25 -12 -27 -6 -28 Z"
        fill="url(#skin)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 16 -14 C 16 4 12 14 2 16 C -6 17 -12 12 -14 6 C -4 10 10 2 16 -14 Z" fill="#0f172a" opacity="0.35"/>
  <path d="M -14 -18 C -12 -24 -6 -26 0 -26" stroke="#e2e8f0" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- satchel strap -->
  <path d="M 10 -20 L -8 12" stroke="#78350f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 10 -20 L -8 12" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>

  <!-- messenger cap with cyan band and a forward brim -->
  <path d="M -16 -23 C -15 -34 3 -37 10 -26 L 10 -23 Z" fill="url(#cap)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M -16 -23.5 L 10 -23.5" stroke="#22d3ee" stroke-width="1.8"/>
  <path d="M -15 -23 C -19 -23 -23 -22 -25 -19.5 L -14 -20 Z" fill="#1e3a8a" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M -6 -33 C -2 -34.5 3 -34 6 -31" stroke="#93c5fd" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- one big, determined eye -->
  <ellipse cx="-8" cy="-14" rx="5" ry="5.5" fill="#f8fafc" stroke="#0a0a0a" stroke-width="1.4"/>
  <circle cx="-10" cy="-13.4" r="2.5" fill="#0f172a"/>
  <circle cx="-10.9" cy="-14.5" r="0.85" fill="#ffffff"/>
  <path d="M -13.8 -18.6 L -2.8 -17" stroke="#0a0a0a" stroke-width="1.7" stroke-linecap="round"/>

  <!-- small focused mouth -->
  <path d="M -13 -6 C -11 -4.6 -8.2 -4.6 -6.6 -6" stroke="#0f172a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</svg>
