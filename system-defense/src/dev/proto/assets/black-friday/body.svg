<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 150 125" width="600" height="500">
  <!-- Black Friday "Cart Juggernaut" · body part. Body space; pivot for lean is (6, 40). -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57534e"/>
      <stop offset="0.35" stop-color="#292524"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d3d1"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab308"/>
      <stop offset="1" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="mouth" cx="-36" cy="16" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.35" stop-color="#dc2626"/>
      <stop offset="0.7" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#1c0505"/>
    </radialGradient>
    <radialGradient id="iris" cx="-37" cy="-18" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="0.4" stop-color="#f87171"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0 V8 M0 0 H8" stroke="#facc15" stroke-opacity="0.16" stroke-width="1.2" fill="none"/>
    </pattern>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyClip">
      <path d="M -50 -34 C -40 -48 -10 -53 20 -50 C 34 -49 44 -44 46 -36 L 42 22 C 41 32 34 36 24 36 L -6 34 L -12 8 L -62 2 C -67 -12 -61 -28 -50 -34 Z"/>
    </clipPath>
  </defs>

  <!-- push handle (behind) -->
  <path d="M 38 -30 L 58 -56" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/>
  <path d="M 38 -30 L 58 -56" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
  <path d="M 37 -32 L 56 -57" stroke="#fef9c3" stroke-width="1.5" stroke-linecap="round"/>
  <g transform="translate(59 -58) rotate(-51.6)">
    <rect x="-9" y="-4" width="18" height="8" rx="4" fill="#dc2626" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="-7" y="-3" width="14" height="2" rx="1" fill="#fca5a5" opacity="0.7"/>
  </g>

  <!-- loot pile -->
  <g transform="translate(-22 -56) rotate(-14.3)">
    <path d="M -5 -10 A 5 5 0 0 1 5 -10" stroke="#0a0a0a" stroke-width="3" fill="none"/>
    <path d="M -9 -10 L 9 -10 L 11 10 L -11 10 Z" fill="url(#bag)" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -9 -6 L 9 -6" stroke="#7f1d1d" stroke-width="1"/>
  </g>
  <g transform="translate(4 -60) rotate(-6.9)">
    <rect x="-15" y="-11" width="30" height="22" fill="url(#box1)" stroke="#0a0a0a" stroke-width="2.5"/>
    <rect x="-2" y="-11" width="4" height="22" fill="#fde68a" opacity="0.6"/>
    <path d="M -15 -5 L 15 -5" stroke="#78350f" stroke-width="1" opacity="0.7"/>
  </g>
  <g transform="translate(30 -57) rotate(12.6)">
    <rect x="-11" y="-9" width="22" height="18" fill="url(#box2)" stroke="#0a0a0a" stroke-width="2.5"/>
    <rect x="-2" y="-9" width="4" height="18" fill="#fde68a" opacity="0.6"/>
  </g>

  <!-- mouth inside (the jaw part covers it when closed) -->
  <path d="M -62 2 L -12 8 L -10 32 L -56 26 Z" fill="url(#mouth)"/>

  <!-- body -->
  <path d="M -50 -34 C -40 -48 -10 -53 20 -50 C 34 -49 44 -44 46 -36 L 42 22 C 41 32 34 36 24 36 L -6 34 L -12 8 L -62 2 C -67 -12 -61 -28 -50 -34 Z"
        fill="url(#metal)" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/>
  <g clip-path="url(#bodyClip)">
    <rect x="-80" y="-60" width="140" height="100" fill="url(#mesh)"/>
    <path d="M 50 -46 L 50 40 L -70 40 L -70 18 C -30 22 20 6 50 -46 Z" fill="#000" opacity="0.4"/>
    <ellipse cx="-18" cy="-38" rx="28" ry="8" fill="#fff" opacity="0.09" transform="rotate(-6 -18 -38)"/>
    <path d="M -4 30 L 38 28" stroke="#facc15" stroke-width="2" opacity="0.5"/>
    <circle cx="2" cy="29.5" r="1.5" fill="#d6d3d1"/>
    <circle cx="14" cy="29" r="1.5" fill="#d6d3d1"/>
    <circle cx="26" cy="28.5" r="1.5" fill="#d6d3d1"/>
  </g>
  <path d="M -50 -34 C -40 -48 -10 -53 20 -50 C 34 -49 44 -44 46 -36" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linecap="round"/>

  <!-- exhaust pipe -->
  <rect x="42" y="-9" width="13" height="7" rx="2" fill="#71717a" stroke="#0a0a0a" stroke-width="2"/>

  <!-- upper teeth (uneven) -->
  <g fill="url(#tooth)" stroke="#0a0a0a" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="-61,2.1 -53,3.1 -56,9.6"/>
    <polygon points="-52.5,3.18 -43.5,4.18 -47,12.68"/>
    <polygon points="-42.5,4.26 -35.5,5.26 -38,10.76"/>
    <polygon points="-35,5.34 -25,6.34 -29,15.84"/>
    <polygon points="-24.5,6.42 -17.5,7.42 -20,13.92"/>
  </g>

  <!-- brow plate -->
  <path d="M -52 -31 L -21 -37 L -23 -29 L -48 -22 Z" fill="url(#gold)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M -50 -31 L -22 -36" stroke="#fef9c3" stroke-width="1.2"/>

  <!-- eyes: big + small (asymmetric) -->
  <circle cx="-36" cy="-17" r="10" fill="#0a0a0a"/>
  <circle cx="-36" cy="-17" r="7.5" fill="url(#iris)" filter="url(#glow)"/>
  <ellipse cx="-37.5" cy="-17" rx="1.8" ry="6" fill="#0a0a0a"/>
  <circle cx="-39.5" cy="-20.5" r="1.6" fill="#ffffff"/>
  <circle cx="-13" cy="-25" r="5.5" fill="#0a0a0a"/>
  <circle cx="-13" cy="-25" r="3.8" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="-14" cy="-25" r="1.5" fill="#0a0a0a"/>

  <!-- price-tag horn -->
  <g transform="translate(-46 -37) rotate(-43)">
    <path d="M -6 0 L 6 0 L 6 -20 L 0 -28 L -6 -20 Z" fill="url(#gold)" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-21" r="1.7" fill="#0a0a0a"/>
    <text x="0" y="-8" font-family="ui-monospace, Menlo, monospace" font-weight="900" font-size="7" fill="#b91c1c" text-anchor="middle">%</text>
  </g>
</svg>
