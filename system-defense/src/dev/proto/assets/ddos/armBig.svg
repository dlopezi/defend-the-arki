<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -10 42 56" width="210" height="280">
  <!-- Giant front arm: a stream of packets ending in a huge fist that drags on the ground. Shoulder at (0, 0). -->
  <defs>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <g id="pk">
      <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.2" stroke="#0a0a0a" stroke-width="1.1"/>
      <path d="M -2.5 -2.3 L 2.5 -2.3" stroke="#fca5a5" stroke-width="0.8" opacity="0.7"/>
    </g>
  </defs>
  <path d="M 5 -6 C -8 -8 -18 4 -20 16 C -22 26 -20 32 -14 34 L -2 30 C -6 22 -4 10 9 2 Z"
        fill="url(#arm)" stroke="#0a0a0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M -2 30 C -6 22 -4 10 9 2 L 6 8 C -1 14 -2 22 -4 28 Z" fill="#000" opacity="0.3"/>
  <use href="#pk" transform="translate(-6 -4) rotate(15) scale(0.8)" fill="#dc2626"/>
  <use href="#pk" transform="translate(-14 4) rotate(-20) scale(0.85)" fill="#ef4444"/>
  <use href="#pk" transform="translate(-19 14) rotate(10) scale(0.8)" fill="#b91c1c"/>
  <use href="#pk" transform="translate(-8 14) rotate(25) scale(0.7)" fill="#991b1b"/>
  <use href="#pk" transform="translate(-20 24) rotate(-15) scale(0.8)" fill="#dc2626"/>
  <!-- huge fist -->
  <use href="#pk" transform="translate(-19 31) rotate(10) scale(1.35)" fill="#dc2626"/>
  <use href="#pk" transform="translate(-10 32) rotate(-15) scale(1.3)" fill="#b91c1c"/>
  <use href="#pk" transform="translate(-17 39) rotate(-5) scale(1.3)" fill="#ef4444"/>
  <use href="#pk" transform="translate(-8 39) rotate(20) scale(1.2)" fill="#991b1b"/>
  <use href="#pk" transform="translate(-24 38) rotate(30) scale(0.9)" fill="#b91c1c"/>
</svg>
